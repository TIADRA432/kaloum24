{% extends "base.html" %}
{% block title %}Connexion — {{ site_name }}{% endblock %}
{% block content %}
<div class="form-box">
  <span class="eyebrow">Compte</span>
  <h1>Connexion</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="identifiant">Pseudo ou e-mail</label>
      <input type="text" id="identifiant" name="identifiant" required autofocus>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="field-check">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Rester connecté</label>
    </div>
    <button type="submit" class="btn btn--block">Se connecter</button>
  </form>
  <p class="form-foot">
    <a href="{{ url_for('auth.forgot_password') }}">Mot de passe oublié ?</a><br>
    Pas encore de compte ? <a href="{{ url_for('auth.register') }}">Inscris-toi</a>.
  </p>
</div>
{% endblock %}
