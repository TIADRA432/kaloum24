{% extends "base.html" %}
{% block title %}Mot de passe oublié — {{ site_name }}{% endblock %}
{% block content %}
<div class="form-box">
  <span class="eyebrow">Compte</span>
  <h1>Mot de passe oublié</h1>
  <p class="form-foot" style="margin-top:0;">Indique ton adresse e-mail : nous t'enverrons un lien pour choisir un nouveau mot de passe.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <button type="submit" class="btn btn--block">Envoyer le lien</button>
  </form>
  <p class="form-foot"><a href="{{ url_for('auth.login') }}">Retour à la connexion</a></p>
</div>
{% endblock %}
