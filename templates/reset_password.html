{% extends "base.html" %}
{% block title %}Nouveau mot de passe — {{ site_name }}{% endblock %}
{% block content %}
<div class="form-box">
  <span class="eyebrow">Compte</span>
  <h1>Choisir un nouveau mot de passe</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" name="password" required minlength="8" autofocus>
      <p class="field-hint">8 caractères minimum.</p>
    </div>
    <div class="field">
      <label for="password_confirm">Confirmer</label>
      <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
    </div>
    <button type="submit" class="btn btn--block">Enregistrer</button>
  </form>
</div>
{% endblock %}
