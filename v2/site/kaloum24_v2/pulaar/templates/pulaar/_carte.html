<div class="tc-carte">
  <div class="tc-carte__meta">
    {{ t.part_of_speech }}
    {% if t.status == 'validated' %}<span class="tc-pastille tc-pastille--validee">Validé</span>{% else %}<span class="tc-pastille">Documenté</span>{% endif %}
  </div>
  <h3><a href="{% url 'pulaar:terme' t.slug %}">{{ t.lemma }}</a></h3>
  {% for d in t.definitions.all %}{% if d.lang == 'fr' %}<p>{{ d.text }}</p>{% endif %}{% endfor %}
</div>
